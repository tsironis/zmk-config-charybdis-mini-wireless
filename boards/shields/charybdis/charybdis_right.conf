CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Disabled: this rail draws ~3.8mA during deep sleep vs 60uA disabled, and
# nothing in this keymap toggles ext-power (the PMW3610 manages its own
# sensor power state via PM device actions). See
# https://github.com/280Zo/charybdis-wireless-mini-zmk-firmware/issues/17
CONFIG_ZMK_EXT_POWER=n

# Hi-res smooth scrolling: emit fractional wheel notches via the HID Resolution
# Multiplier so the host (macOS supports it) scrolls continuously instead of in
# coarse notches. This bypasses macOS's notch-based scroll acceleration, removing
# the "dead-zone then sudden speedup" feel. Pairs with a lower scroll divisor in
# charybdis_pointer.dtsi (each wheel unit is now a fraction of a notch).
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# PMW3610 Driver (tsironis fork of efogdev)
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y

# Report interval (16ms = ~62Hz). Eases system-workqueue contention with the
# BLE radio's 7.5ms connection interval and cuts SPI wake cycles, at a small
# tracking-latency cost. Was 12ms/~83Hz.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=16

# Anti-warp: discard large deltas after inactivity (enabled by default in fork)
CONFIG_PMW3610_ANTI_WARP=y
CONFIG_PMW3610_IGNORE_AFTER_REST=y

# REST Downshift Configuration (more aggressive than before, for battery
# life; trades off pointer wake latency after idle. Unverified by live
# capture — watch for feel regressions before keeping long-term.)
# Run → REST1 downshift after ~2s of inactivity
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=2000

# REST1: Check for movement every 100ms, downshift after 3s
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=100
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=3000

# REST2: Check for movement every 200ms, downshift after 30s
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000

# REST3: Deepest sleep state - maximize interval (driver max: 2550ms)
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=2550

# Extra delay for sensor power-up stabilization
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Split queue headroom (defaults 5, 5 and 512). Absorbs bursts of
# left-half key events and behavior runs while the trackball keeps the
# central busy. Costs about 1-2KB of RAM, with the right half at 28%.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=10
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1536
