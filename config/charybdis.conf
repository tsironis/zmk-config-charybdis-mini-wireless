CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# EXPERIMENTAL_FEATURES also pulls in _SEC, which a sibling Charybdis config
# (Cyb3rDudu/zmk-charybdis) flags as causing BLE reconnect issues on macOS —
# exactly the host-side symptom this repo's own capture already confirmed.
# Use CONN alone.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# STOCK-BLE TEST (2026-08-14)
#
# The BLE tuning block that used to live here was added to fix a diagnosed
# "system workqueue starvation -> tx_complete_work starves -> buffers never
# recycle -> bt_l2cap_create_pdu_timeout(K_FOREVER) deadlock".
#
# Live USB CDC capture during an actual freeze disproved that diagnosis:
# the system workqueue was alive throughout (30s heartbeats kept printing),
# the HID msgq drained normally, ACL TX buffers kept recycling, and
# bt_gatt_notify_cb returned 0 for every report. See
# claudedocs/sleep-debug-results.md on the sleep-debug-driver-pm-bisect branch.
#
# So these settings were treating a mechanism that is not occurring, and the
# symptom they were meant to prevent persists. Removed for this test:
#
#   CONFIG_BT_CTLR_TX_PWR_PLUS_8      +8 dBm TX power (stock is 0 dBm)
#   CONFIG_BT_RECV_WORKQ_BT           dedicated BLE RX workqueue
#   CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE  input/split work off the system WQ
#   CONFIG_BT_BUF_ACL_TX_COUNT=10     expanded ACL/L2CAP/ATT TX pools
#   CONFIG_BT_BUF_EVT_RX_COUNT=11
#   CONFIG_BT_L2CAP_TX_BUF_COUNT=10
#   CONFIG_BT_ATT_TX_COUNT=4
#   CONFIG_BT_CONN_TX_MAX=10
#   CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12   doubled connection interval
#   CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
#
# Deliberately KEPT: the stack and queue size increases below. Shrinking a
# stack can produce fresh crashes, which would confound the result rather
# than inform it. These are headroom, not protocol behaviour.

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Hardware stack-overflow trap. Stack overflow was ruled out for the earlier
# freeze by inspection only; this turns "ruled out by inspection" into "ruled
# out by hardware trap" (an MPU fault + reset) if anything like it recurs.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# Power Management
# Idle mode after 30s of inactivity (lighter power saving before deep sleep)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep support to reduce power consumption when idle
CONFIG_ZMK_SLEEP=y

# Enter deep sleep after 15 minutes of inactivity.
# On deep sleep wake, full driver re-init clears sensor registers.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
