manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tsironis
      url-base: https://github.com/tsironis

  projects:
    - name: zmk
      remote: tsironis
      revision: charybdis-sleep-debug  # charybdis-input-fix + sleep-entry breadcrumbs (SLEEP-DEBUG branch)
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: tsironis
      # EXPERIMENT 15b: b8ecaea with ONLY the PM device registration and the
